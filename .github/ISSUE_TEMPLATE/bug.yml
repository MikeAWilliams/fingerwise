name: Bug
description: Something in the app does not work as expected.
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Firefox 130 on Android 15
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the note and settings in use, console errors.
